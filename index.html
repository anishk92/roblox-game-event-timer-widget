
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Live Events & Countdowns | TechBoltX</title>
    <style>
        :root { color-scheme: dark; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0b0f19;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .roblox-wrapper { max-width: 900px; margin: 0 auto; }
        h2 {
            font-size: 20px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .hub-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }
        .hub-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 16px;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);
            min-width: 0;
        }
        .hub-card:hover {
            transform: translateY(-2px);
            border-color: #38bdf8;
        }
        .hub-card.live { border-color: #ef4444; }
        .hub-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .hub-avatar {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            background: #334155;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
            color: #fff;
            flex-shrink: 0;
        }
        .hub-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .hub-title { min-width: 0; }
        .hub-title .hub-game {
            font-weight: 700;
            font-size: 15px;
            color: #f8fafc;
            line-height: 1.2;
        }
        .hub-title .hub-event {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 4px;
        }
        .hub-status {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }
        .live-status { color: #ef4444; }
        .upcoming-status { color: #38bdf8; }
        .hub-timer {
            font-size: 13px;
            font-weight: 600;
            color: #facc15;
            background: #0f172a;
            padding: 8px 12px;
            border-radius: 6px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }
        .footer-credit {
            text-align: center;
            margin-top: 40px;
            font-size: 13px;
            color: #64748b;
            border-top: 1px solid #1e293b;
            padding-top: 16px;
        }
        .footer-credit a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
        }
        .message {
            color: #94a3b8;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 16px;
            grid-column: 1 / -1;
        }
        .error { color: #fca5a5; }
        @media (max-width: 480px) {
            body { padding: 14px; }
            .hub-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="roblox-wrapper">

    <h2>🔴 Live Now <span id="live-count"></span></h2>
    <div id="live-grid" class="hub-grid">
        <div class="message">Loading live events...</div>
    </div>

    <h2>⏳ Upcoming Events <span id="upcoming-count"></span></h2>
    <div id="upcoming-grid" class="hub-grid">
        <div class="message">Loading upcoming events...</div>
    </div>

    <div class="footer-credit">
        Powered by TechBoltX ·
        <a href="https://techboltx.com/roblox-game-event-time/" target="_blank" rel="noopener">
            View all Roblox event timers
        </a>
    </div>

</div>

<script>
(() => {
    "use strict";

    const API_URL =
        "https://techboltx.com/wp-json/techboltx/v1/roblox-events";

    const REFRESH_INTERVAL = 60000;

    function formatCountdown(timestamp, status) {
        const now = Math.floor(Date.now() / 1000);
        const diff = Math.max(0, Number(timestamp) - now);

        if (diff <= 0) {
            return status === "LIVE" ? "Event ending now" : "Starting now";
        }

        const days = Math.floor(diff / 86400);
        const hours = Math.floor((diff % 86400) / 3600);
        const minutes = Math.floor((diff % 3600) / 60);
        const seconds = diff % 60;

        return `${days}d ${hours}h ${minutes}m ${seconds}s`;
    }

    function createCard(event, status) {
        const isLive = status === "LIVE";
        const target = Number(isLive ? event.end : event.start);

        const card = document.createElement("a");
        card.className = "hub-card" + (isLive ? " live" : "");

        let gameUrl = "https://techboltx.com/roblox-game-event-time/";

        try {
            const parsed = new URL(event.game_url);
            if (parsed.protocol === "https:" &&
                parsed.hostname === "techboltx.com") {
                gameUrl = parsed.href;
            }
        } catch (_) {}

        card.href = gameUrl;

        const header = document.createElement("div");
        header.className = "hub-header";

        const avatar = document.createElement("div");
        avatar.className = "hub-avatar";

        if (event.image) {
            try {
                const imageUrl = new URL(event.image);
                if (imageUrl.protocol === "https:" &&
                    (imageUrl.hostname === "tr.rbxcdn.com" ||
                     imageUrl.hostname === "techboltx.com")) {
                    const img = document.createElement("img");
                    img.src = imageUrl.href;
                    img.alt = event.game || "Roblox game";
                    img.loading = "lazy";
                    avatar.appendChild(img);
                }
            } catch (_) {}
        }

        if (!avatar.firstChild) {
            avatar.textContent = (event.game || "R").charAt(0);
        }

        const titleBox = document.createElement("div");
        titleBox.className = "hub-title";

        const game = document.createElement("div");
        game.className = "hub-game";
        game.textContent = event.game || "Roblox Game";

        const eventTitle = document.createElement("div");
        eventTitle.className = "hub-event";
        eventTitle.textContent = event.title || "Roblox Event";

        titleBox.append(game, eventTitle);
        header.append(avatar, titleBox);

        const statusLabel = document.createElement("div");
        statusLabel.className =
            "hub-status " + (isLive ? "live-status" : "upcoming-status");
        statusLabel.textContent = isLive ? "LIVE NOW" : "UPCOMING";

        const timer = document.createElement("div");
        timer.className = "hub-timer";
        timer.dataset.target = String(target);
        timer.dataset.status = status;
        timer.textContent = isLive
            ? "Event ends in " + formatCountdown(target, status)
            : "Starts in " + formatCountdown(target, status);

        card.append(header, statusLabel, timer);

        return card;
    }

    function renderEvents(gridId, countId, events, status) {
        const grid = document.getElementById(gridId);
        const count = document.getElementById(countId);

        grid.replaceChildren();
        count.textContent = `(${events.length})`;

        if (!events.length) {
            const message = document.createElement("div");
            message.className = "message";
            message.textContent = status === "LIVE"
                ? "No live events right now."
                : "No upcoming events found.";
            grid.appendChild(message);
            return;
        }

        events.forEach(event => {
            grid.appendChild(createCard(event, status));
        });
    }

    function updateCountdowns() {
        document.querySelectorAll(".hub-timer[data-target]").forEach(timer => {
            const target = Number(timer.dataset.target);
            const status = timer.dataset.status;

            timer.textContent = status === "LIVE"
                ? "Event ends in " + formatCountdown(target, status)
                : "Starts in " + formatCountdown(target, status);
        });
    }

    async function loadRobloxWidgets() {
        try {
            const response = await fetch(API_URL, {
                method: "GET",
                cache: "no-store",
                headers: { "Accept": "application/json" }
            });

            if (!response.ok) {
                throw new Error("API HTTP " + response.status);
            }

            const data = await response.json();

            if (!data || data.success === false) {
                throw new Error("Invalid API response");
            }

            const live = Array.isArray(data.live) ? data.live : [];
            const upcoming = Array.isArray(data.upcoming) ? data.upcoming : [];

            renderEvents("live-grid", "live-count", live, "LIVE");
            renderEvents("upcoming-grid", "upcoming-count", upcoming, "UPCOMING");

            updateCountdowns();

        } catch (error) {
            console.error("Roblox events API error:", error);

            ["live-grid", "upcoming-grid"].forEach(id => {
                const message = document.createElement("div");
                message.className = "message error";
                message.textContent =
                    "Unable to load events. Please try again later.";
                document.getElementById(id).replaceChildren(message);
            });
        }
    }

    loadRobloxWidgets();

    // Countdown changes every second without calling the API.
    setInterval(updateCountdowns, 1000);

    // Fetch fresh event data once every minute.
    setInterval(loadRobloxWidgets, REFRESH_INTERVAL);

})();
</script>

</body>
</html>
